<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI — Veil</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:             #060610;
      --surface:        #0e0e1e;
      --surface2:       #15152a;
      --border:         #1e1e38;
      --text:           #ecedf8;
      --muted:          #6264a0;
      --accent:         #6366f1;
      --accent-light:   #818cf8;
      --accent-lighter: #a5b4fc;
    }

    body {
      font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────── */
    .site-header {
      position: relative;
      z-index: 10;
      background: rgba(6, 6, 16, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .site-header-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }
    .site-logo-text { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    .header-right { display: flex; align-items: center; gap: 20px; }
    .site-nav { display: flex; align-items: center; gap: 0; }
    .site-nav-link {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      padding: 0.25rem 0.6rem;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      position: relative;
    }
    .site-nav-link::after { content: '/'; position: absolute; right: -1px; color: rgba(99,102,241,0.18); font-size: 0.62rem; pointer-events: none; }
    .site-nav-link:last-child::after { display: none; }
    .site-nav-link:hover { color: var(--accent-lighter); background: rgba(99,102,241,0.08); }
    .site-nav-link.active { color: var(--accent-light); }

    /* ── Model picker (in header) ───────────────────────── */
    .model-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 10px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    .model-select:focus { border-color: var(--accent); }

    /* ── Chat layout ─────────────────────────────────────── */
    .chat-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      min-height: 0;
      padding: 0 20px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 24px 0;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Empty state ─────────────────────────────────────── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      text-align: center;
      padding: 40px 0;
    }
    .empty-state svg { opacity: 0.3; }
    .empty-state-title { font-size: 18px; font-weight: 600; color: var(--text); opacity: 0.5; }
    .empty-state-sub { font-size: 13px; line-height: 1.55; max-width: 320px; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }
    .suggestion-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      font-family: inherit;
    }
    .suggestion-chip:hover { border-color: var(--accent); color: var(--accent-lighter); }

    /* ── Messages ────────────────────────────────────────── */
    .message { display: flex; gap: 10px; align-items: flex-start; }
    .message.user { flex-direction: row-reverse; }

    .message-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .message.ai .message-avatar { background: var(--surface2); border: 1px solid var(--border); }
    .message.user .message-avatar { background: var(--accent); }

    .message-bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
    }
    .message.ai .message-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      color: var(--text);
    }
    .message.user .message-bubble {
      background: var(--accent);
      color: #fff;
      border-top-right-radius: 4px;
    }

    .message-bubble p { margin-bottom: 10px; }
    .message-bubble p:last-child { margin-bottom: 0; }
    .message-bubble ul, .message-bubble ol { padding-left: 20px; margin: 6px 0; }
    .message-bubble li { margin-bottom: 3px; }
    .message-bubble strong { font-weight: 700; }
    .message-bubble em { font-style: italic; }
    .message-bubble code {
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
    }
    .message-bubble pre {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .message-bubble pre code { background: none; padding: 0; font-size: 13px; }
    .message-bubble ul, .message-bubble ol { padding-left: 20px; margin: 8px 0; }
    .message-bubble li { margin-bottom: 4px; }
    .message-bubble strong { font-weight: 600; }

    /* Typing indicator */
    .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      animation: typing-bounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

    /* ── Input area ──────────────────────────────────────── */
    .input-area {
      flex-shrink: 0;
      padding: 16px 0 20px;
      border-top: 1px solid var(--border);
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      transition: border-color 0.15s;
    }
    .input-row:focus-within { border-color: var(--accent); }

    #chat-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 22px;
      max-height: 160px;
      line-height: 1.55;
    }
    #chat-input::placeholder { color: var(--muted); }

    .send-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: filter 0.15s, opacity 0.15s;
    }
    .send-btn:hover:not(:disabled) { filter: brightness(1.12); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .input-hint {
      font-size: 11px;
      color: var(--border);
      text-align: center;
      margin-top: 8px;
    }

    /* ── Ambassador features ──────────────────────────── */
    .amb-tools {
      display: none;
      gap: 6px;
      align-items: center;
    }
    .amb-tools.show { display: flex; }
    .amb-btn {
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.25);
      color: #f59e0b;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .amb-btn:hover { background: rgba(245,158,11,0.2); }
    .amb-badge-sm {
      font-size: 9px;
      font-weight: 700;
      color: #f59e0b;
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.25);
      border-radius: 4px;
      padding: 2px 6px;
      letter-spacing: 0.04em;
    }
    .amb-prompt-row {
      display: none;
      padding: 0 20px;
      max-width: 760px;
      margin: 0 auto;
      width: 100%;
    }
    .amb-prompt-row.show { display: block; }
    .amb-prompt-input {
      width: 100%;
      background: rgba(245,158,11,0.06);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      resize: none;
      outline: none;
    }
    .amb-prompt-input:focus { border-color: rgba(245,158,11,0.4); }
    .amb-prompt-input::placeholder { color: rgba(245,158,11,0.4); }

    /* ── Screen share ───────────────────────────────────── */
    .screen-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      padding: 5px 10px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .screen-btn:hover { color: var(--text); border-color: var(--accent); }
    .screen-btn.active {
      color: #4ade80;
      border-color: #4ade8055;
      background: rgba(74,222,128,0.07);
    }
    .screen-preview-row {
      display: none;
      padding: 0 0 10px;
      position: relative;
    }
    .screen-preview-row.show { display: block; }
    .screen-preview-wrap {
      position: relative;
      display: inline-block;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #4ade8033;
    }
    #screen-preview {
      display: block;
      max-width: 100%;
      max-height: 140px;
      border-radius: 8px;
    }
    .screen-preview-label {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 10px;
      font-weight: 600;
      color: #4ade80;
      background: rgba(0,0,0,0.6);
      border-radius: 4px;
      padding: 2px 6px;
      letter-spacing: 0.04em;
    }
    .screen-stop-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      border: none;
      border-radius: 4px;
      color: #fca5a5;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      cursor: pointer;
      font-family: inherit;
    }

    /* ── Footer ─────────────────────────────────────────── */
    .site-footer {
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .site-footer-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 12px;
      color: var(--muted);
    }
    .site-footer-inner a { color: var(--muted); text-decoration: none; transition: color 0.15s; }
    .site-footer-inner a:hover { color: var(--text); }
    .site-footer-sep { opacity: 0.4; }
  </style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <div class="site-header-inner">
    <a class="site-logo" href="/">
      <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="4" y1="21" x2="28" y2="21" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M8 26 L16 13 L24 26" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="site-logo-text">Veil</span>
    </a>
    <div class="header-right">
      <select class="model-select" id="model-select">
        <option value="llama-3.1-8b-instant">Llama 3.1 8B</option>

        <option value="mistral-saba-24b">Mistral 24B</option>

      </select>
      <div class="amb-tools" id="amb-tools">

        <button class="amb-btn" id="amb-prompt-toggle" title="Custom system prompt">Prompt</button>
      </div>
      <nav class="site-nav">
        <a class="site-nav-link" href="/">home</a>
        <a class="site-nav-link" href="/music.html">music</a>
        <a class="site-nav-link active" href="/ai.html">ai</a>
        <a class="site-nav-link" href="/remote.html">remote</a>
      </nav>
    </div>
  </div>
</header>

<!-- Chat -->
<div class="chat-wrap">
  <div class="amb-prompt-row" id="amb-prompt-row">
    <textarea class="amb-prompt-input" id="amb-system-prompt" rows="2" placeholder="Custom system prompt (Ambassador) — e.g. &quot;You are a pirate who only speaks in pirate slang&quot;"></textarea>
  </div>
  <div class="messages" id="messages">
    <div class="empty-state" id="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent-lighter)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10a10 10 0 0 1-10-10C2 6.48 6.48 2 12 2z"/>
        <path d="M12 16v-4M12 8h.01"/>
      </svg>
      <div class="empty-state-title">Veil AI</div>
      <div class="empty-state-sub">Ask anything — homework help, explanations, code, ideas. Powered by Groq.</div>
      <div class="suggestions">
        <button class="suggestion-chip" data-prompt="Explain how proxies work in simple terms">How do proxies work?</button>
        <button class="suggestion-chip" data-prompt="Help me with my homework on the American Revolution">History homework help</button>
        <button class="suggestion-chip" data-prompt="Write a Python function to reverse a string">Python code help</button>
        <button class="suggestion-chip" data-prompt="What are some tips for studying more effectively?">Study tips</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="screen-preview-row" id="screen-preview-row">
      <div class="screen-preview-wrap">
        <canvas id="screen-preview"></canvas>
        <span class="screen-preview-label">LIVE</span>
        <button class="screen-stop-btn" id="screen-stop-btn">Stop</button>
      </div>
    </div>
    <div class="input-row">
      <button class="screen-btn" id="screen-btn" title="Share screen with AI">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Screen
      </button>
      <textarea id="chat-input" placeholder="Ask anything…" rows="1"></textarea>
      <button class="send-btn" id="send-btn" disabled aria-label="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">Powered by <a href="https://groq.com" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;text-underline-offset:2px;">Groq</a> · Free &amp; fast · <a href="/ai/widget" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;text-underline-offset:2px;">Use on any site</a></div>
  </div>
</div>

<!-- Footer -->
<footer class="site-footer">
  <div class="site-footer-inner">
    <span>Powered by <a href="https://github.com/MercuryWorkshop/scramjet" target="_blank" rel="noopener">Scramjet</a></span>
    <span class="site-footer-sep">·</span>
    <a href="https://discord.gg/NScKEHkd6U" target="_blank" rel="noopener">Join Discord</a>
  </div>
</footer>

<script>
  const messagesEl  = document.getElementById("messages");
  const inputEl     = document.getElementById("chat-input");
  const sendBtn     = document.getElementById("send-btn");
  const emptyState  = document.getElementById("empty-state");
  const modelSelect = document.getElementById("model-select");

  const history = []; // { role, content }
  let isLoading = false;

  // ── Screen share ─────────────────────────────────────────────────────────
  let screenStream   = null;
  let screenVideo    = null;
  let screenInterval = null;
  const screenBtn        = document.getElementById("screen-btn");
  const screenPreviewRow = document.getElementById("screen-preview-row");
  const screenCanvas     = document.getElementById("screen-preview");
  const screenStopBtn    = document.getElementById("screen-stop-btn");
  const screenCtx        = screenCanvas.getContext("2d");

  screenBtn.addEventListener("click", async () => {
    if (screenStream) { stopScreenShare(); return; }
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 5 }, audio: false });
      screenVideo  = document.createElement("video");
      screenVideo.srcObject = screenStream;
      screenVideo.muted = true;
      await screenVideo.play();

      screenStream.getVideoTracks()[0].addEventListener("ended", stopScreenShare);

      // Draw preview frames
      screenInterval = setInterval(() => {
        if (!screenVideo || screenVideo.readyState < 2) return;
        const vw = screenVideo.videoWidth, vh = screenVideo.videoHeight;
        const maxH = 140, maxW = screenCanvas.parentElement?.offsetWidth || 600;
        const scale = Math.min(maxW / vw, maxH / vh, 1);
        screenCanvas.width  = Math.round(vw * scale);
        screenCanvas.height = Math.round(vh * scale);
        screenCtx.drawImage(screenVideo, 0, 0, screenCanvas.width, screenCanvas.height);
      }, 200);

      screenBtn.classList.add("active");
      screenBtn.querySelector("svg").style.color = "#4ade80";
      screenPreviewRow.classList.add("show");
      modelSelect.value = "meta-llama/llama-4-scout-17b-16e-instruct";
    } catch (e) {
      if (e.name !== "NotAllowedError") console.warn("Screen share error:", e);
    }
  });

  screenStopBtn.addEventListener("click", stopScreenShare);

  function stopScreenShare() {
    if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
    if (screenInterval) { clearInterval(screenInterval); screenInterval = null; }
    screenVideo = null;
    screenBtn.classList.remove("active");
    screenPreviewRow.classList.remove("show");
    // Restore model if it was auto-switched
    if (modelSelect.value === "meta-llama/llama-4-scout-17b-16e-instruct") modelSelect.value = "llama-3.1-8b-instant";
  }

  function captureScreenFrame() {
    if (!screenVideo || screenVideo.readyState < 2) return null;
    // Capture at full resolution for API (preview canvas is tiny — don't use it)
    const vw = screenVideo.videoWidth, vh = screenVideo.videoHeight;
    if (!vw || !vh) return null;
    const cap = document.createElement("canvas");
    cap.width = vw; cap.height = vh;
    cap.getContext("2d").drawImage(screenVideo, 0, 0, vw, vh);
    return cap.toDataURL("image/jpeg", 0.85).split(",")[1];
  }

  // Auto-resize textarea
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    sendBtn.disabled = !inputEl.value.trim() || isLoading;
  });

  // Send on Enter (Shift+Enter = newline)
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  sendBtn.addEventListener("click", send);

  // Suggestion chips
  document.querySelectorAll(".suggestion-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      inputEl.value = chip.dataset.prompt;
      inputEl.dispatchEvent(new Event("input"));
      send();
    });
  });

  function send() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    if (emptyState) emptyState.remove();

    const frame = captureScreenFrame();

    addMessage("user", text);
    history.push({ role: "user", content: text }); // store text-only in history

    // For the actual API call, attach the screen frame to the latest user message only
    const messagesForApi = [
      ...history.slice(0, -1),
      {
        role: "user",
        content: frame
          ? [{ type: "text", text }, { type: "image_url", image_url: { url: `data:image/jpeg;base64,${frame}` } }]
          : text,
      },
    ];

    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;
    isLoading = true;

    const typingEl = addTyping();

    const model = modelSelect.value;

    fetch("/api/ai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: [
          { role: "system", content: frame ? "You are a helpful assistant built into Veil. The user has shared their screen — a screenshot is attached to their message. ALWAYS look at the screenshot first to understand the context of their request before answering. If they refer to problems, questions, or items by number or range (like \"46-54\"), find those on the screen rather than interpreting it as math. Keep responses clear and concise. Format using markdown where helpful." : "You are a helpful, friendly assistant built into Veil. Keep responses clear and concise. Format using markdown where helpful." },
          ...messagesForApi,
        ],
        model,
      }),
    })
      .then(r => r.json().then(d => ({ ok: r.ok, d })))
      .then(({ ok, d }) => {
        typingEl.remove();
        if (!ok) throw new Error(d.error || "Unknown error");
        const reply = d.content.trim();
        history.push({ role: "assistant", content: reply });
        addMessage("ai", reply);
      })
      .catch(err => {
        typingEl.remove();
        addMessage("ai", `Sorry, something went wrong: ${err.message}. Try again.`);
      })
      .finally(() => {
        isLoading = false;
        sendBtn.disabled = !inputEl.value.trim();
        inputEl.focus();
      });
  }

  function addMessage(role, content) {
    const msg = document.createElement("div");
    msg.className = `message ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "message-avatar";
    avatar.innerHTML = role === "ai"
      ? `<svg width="14" height="14" viewBox="0 0 32 32" fill="none"><line x1="4" y1="21" x2="28" y2="21" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/><path d="M8 26 L16 13 L24 26" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;

    const bubble = document.createElement("div");
    bubble.className = "message-bubble";
    bubble.innerHTML = role === "ai" ? renderMarkdown(content) : escHtml(content).replace(/\n/g, "<br>");

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return msg;
  }

  function addTyping() {
    const msg = document.createElement("div");
    msg.className = "message ai";
    msg.innerHTML = `
      <div class="message-avatar">
        <svg width="14" height="14" viewBox="0 0 32 32" fill="none"><line x1="4" y1="21" x2="28" y2="21" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/><path d="M8 26 L16 13 L24 26" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="message-bubble" style="padding:14px 16px;">
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>`;
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return msg;
  }

  // Basic markdown renderer
  function renderMarkdown(text) {
    const mathBlocks = [], rawBlocks = [];
    // 1. Stash code blocks (don't touch their content)
    let s = text.replace(/```([\w]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      rawBlocks.push(`<pre><code>${escHtml(code.trim())}</code></pre>`);
      return `\x00R${rawBlocks.length-1}\x00`;
    });
    s = s.replace(/`([^`\n]+)`/g, (_, c) => {
      rawBlocks.push(`<code>${escHtml(c)}</code>`);
      return `\x00R${rawBlocks.length-1}\x00`;
    });
    // 2. Stash math
    s = s.replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]/g, (_, a, b) => {
      const expr = (a || b).trim();
      try { mathBlocks.push(typeof katex !== "undefined" ? katex.renderToString(expr, { displayMode: true, throwOnError: false }) : `<span>$$${escHtml(expr)}$$</span>`); }
      catch { mathBlocks.push(`<span>$$${escHtml(expr)}$$</span>`); }
      return `\x00M${mathBlocks.length-1}\x00`;
    });
    s = s.replace(/\$([^\$\n]+?)\$|\\\((.+?)\\\)/g, (_, a, b) => {
      const expr = (a || b).trim();
      try { mathBlocks.push(typeof katex !== "undefined" ? katex.renderToString(expr, { displayMode: false, throwOnError: false }) : `<span>$${escHtml(expr)}$</span>`); }
      catch { mathBlocks.push(`<span>$${escHtml(expr)}$</span>`); }
      return `\x00M${mathBlocks.length-1}\x00`;
    });
    // 3. Escape remaining HTML
    s = escHtml(s);
    // 4. Markdown
    // Headers
    s = s.replace(/^######\s+(.+)$/gm, '<strong style="font-size:0.85em">$1</strong>');
    s = s.replace(/^#{1,5}\s+(.+)$/gm, '<strong>$1</strong>');
    // Bold before italic
    s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_\n]+?)__/g,    '<strong>$1</strong>');
    s = s.replace(/\*([^*\n]+?)\*/g,    '<em>$1</em>');
    s = s.replace(/_([^_\n]+?)_/g,      '<em>$1</em>');
    // Lists — collect consecutive list lines into <ul>/<ol>
    s = s.replace(/((?:^[-*•]\s+.+$\n?)+)/gm, block => {
      const items = block.trim().split('\n').map(l => `<li>${l.replace(/^[-*•]\s+/, '')}</li>`).join('');
      return `<ul>${items}</ul>`;
    });
    s = s.replace(/((?:^\d+\.\s+.+$\n?)+)/gm, block => {
      const items = block.trim().split('\n').map(l => `<li>${l.replace(/^\d+\.\s+/, '')}</li>`).join('');
      return `<ol>${items}</ol>`;
    });
    // Paragraphs
    s = s.split(/\n{2,}/).map(p => {
      p = p.trim();
      if (!p) return '';
      if (/^<(ul|ol|pre|strong|h[1-6])/.test(p)) return p;
      return `<p>${p.replace(/\n/g, '<br>')}</p>`;
    }).join('');
    // 5. Restore stashed blocks
    s = s.replace(/\x00M(\d+)\x00/g, (_, i) => mathBlocks[+i]);
    s = s.replace(/\x00R(\d+)\x00/g, (_, i) => rawBlocks[+i]);
    return s;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  inputEl.focus();

  // ── Ambassador features ──────────────────────────────────────────────────
  (function initAmbFeatures() {
    const isAmb = !!JSON.parse(localStorage.getItem("veil_ambassador_v1") || "null");
    if (!isAmb) return;

    document.getElementById("amb-tools").classList.add("show");

    // Export conversation
    document.getElementById("amb-export-btn").addEventListener("click", () => {
      if (!history.length) return;
      const text = history.map(m => `[${m.role === "user" ? "You" : "AI"}]\n${m.content}`).join("\n\n---\n\n");
      const blob = new Blob([text], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `veil-ai-chat-${Date.now()}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    });

    // Custom system prompt toggle
    const promptRow = document.getElementById("amb-prompt-row");
    document.getElementById("amb-prompt-toggle").addEventListener("click", () => {
      promptRow.classList.toggle("show");
    });

    // Override the system prompt used in fetch
    const origSend = window.send || send;
    // Patch: intercept the fetch call to inject custom system prompt
    const _origFetch = window.fetch;
    window.fetch = function(url, opts) {
      if (url === "/api/ai" && opts?.body) {
        try {
          const body = JSON.parse(opts.body);
          const custom = document.getElementById("amb-system-prompt")?.value?.trim();
          if (custom && body.messages?.[0]?.role === "system") {
            body.messages[0].content += "\n\nAdditional instructions: " + custom;
            opts.body = JSON.stringify(body);
          }
        } catch {}
      }
      return _origFetch.call(this, url, opts);
    };
  })();
</script>
