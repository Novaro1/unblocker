<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0f0e1f"/>
      <stop offset="100%" stop-color="#060610"/>
    </radialGradient>
    <radialGradient id="glowRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="60%"  stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#060610" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%"   stop-color="#a5b4fc"/>
      <stop offset="55%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </radialGradient>
    <radialGradient id="pupilGrad" cx="40%" cy="38%" r="55%">
      <stop offset="0%"   stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#06060f"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="240"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="250" cy="250" r="250" fill="url(#bgGrad)"/>

  <!-- Outer glow halo -->
  <circle cx="250" cy="250" r="200" fill="url(#glowRing)" clip-path="url(#circleClip)"/>

  <!-- Decorative orbit rings -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="#6366f1" stroke-width="0.6" stroke-opacity="0.18"/>
  <circle cx="250" cy="250" r="170" fill="none" stroke="#6366f1" stroke-width="0.4" stroke-opacity="0.12"/>

  <!-- Tick marks on outer ring -->
  <g stroke="#a5b4fc" stroke-width="1.2" stroke-opacity="0.35">
    <line x1="250" y1="55"  x2="250" y2="68"/>
    <line x1="250" y1="432" x2="250" y2="445"/>
    <line x1="55"  y1="250" x2="68"  y2="250"/>
    <line x1="432" y1="250" x2="445" y2="250"/>
    <line x1="117" y1="117" x2="126" y2="126"/>
    <line x1="374" y1="117" x2="365" y2="126"/>
    <line x1="117" y1="383" x2="126" y2="374"/>
    <line x1="374" y1="383" x2="365" y2="374"/>
  </g>

  <!-- Stars scattered -->
  <g fill="#a5b4fc" opacity="0.5">
    <circle cx="105" cy="148" r="1.4"/>
    <circle cx="390" cy="160" r="1"/>
    <circle cx="130" cy="340" r="1.2"/>
    <circle cx="372" cy="348" r="1.5"/>
    <circle cx="160" cy="98"  r="1"/>
    <circle cx="338" cy="95"  r="1.3"/>
    <circle cx="88"  cy="240" r="0.9"/>
    <circle cx="412" cy="265" r="1.1"/>
  </g>

  <!-- Eye shape — main element -->
  <!-- Eye white / outer glow -->
  <ellipse cx="250" cy="230" rx="108" ry="62" fill="#6366f1" filter="url(#softGlow)" opacity="0.22"/>

  <!-- Eye outline shape -->
  <path d="M142,230 Q196,148 250,148 Q304,148 358,230 Q304,312 250,312 Q196,312 142,230 Z"
        fill="url(#eyeGrad)" filter="url(#glow)"/>

  <!-- Iris -->
  <circle cx="250" cy="230" r="52" fill="url(#pupilGrad)"/>

  <!-- Iris ring detail -->
  <circle cx="250" cy="230" r="52" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.6"/>
  <circle cx="250" cy="230" r="44" fill="none" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.3"/>
  <circle cx="250" cy="230" r="36" fill="none" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Pupil -->
  <circle cx="250" cy="230" r="26" fill="#030308"/>

  <!-- Pupil reflection -->
  <circle cx="240" cy="220" r="7" fill="white" opacity="0.12"/>
  <circle cx="259" cy="237" r="3" fill="white" opacity="0.06"/>

  <!-- Eyelid line top -->
  <path d="M142,230 Q196,148 250,148 Q304,148 358,230"
        fill="none" stroke="#c7d2fe" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Veil triangle — small, below the eye -->
  <g filter="url(#glow)" opacity="0.85">
    <line x1="182" y1="295" x2="318" y2="295" stroke="rgba(165,180,252,0.25)" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M202,320 L250,248 L298,320" stroke="#a5b4fc" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text: PHANTOM -->
  <text x="250" y="388"
        font-family="'Arial Black', 'Arial Bold', sans-serif"
        font-weight="900"
        font-size="38"
        letter-spacing="10"
        text-anchor="middle"
        fill="#e0e7ff"
        filter="url(#textGlow)"
        opacity="0.95">PHANTOM</text>

  <!-- Text: CHALLENGE — smaller subtitle -->
  <text x="250" y="414"
        font-family="Arial, sans-serif"
        font-weight="400"
        font-size="12"
        letter-spacing="6.5"
        text-anchor="middle"
        fill="#6366f1"
        opacity="0.8">CHALLENGE</text>

  <!-- Border ring -->
  <circle cx="250" cy="250" r="246" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="250" cy="250" r="249" fill="none" stroke="#3730a3" stroke-width="1" stroke-opacity="0.15"/>
</svg>
