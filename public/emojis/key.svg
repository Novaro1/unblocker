<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f0e1f"/>
      <stop offset="100%" stop-color="#07071a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <!-- Key ring -->
  <circle cx="100" cy="100" r="46" fill="none" stroke="#f59e0b" stroke-width="14" filter="url(#glow)"/>
  <!-- Key shaft -->
  <line x1="134" y1="134" x2="210" y2="210" stroke="#fbbf24" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Key teeth -->
  <line x1="172" y1="172" x2="184" y2="160" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
  <line x1="190" y1="190" x2="202" y2="178" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
  <!-- Hole in key -->
  <circle cx="100" cy="100" r="16" fill="#07071a"/>
</svg>
