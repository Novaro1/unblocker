<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f0e1f"/>
      <stop offset="100%" stop-color="#07071a"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <!-- Eye glow -->
  <ellipse cx="128" cy="128" rx="88" ry="50" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <!-- Eye shape -->
  <path d="M40,128 Q84,64 128,64 Q172,64 216,128 Q172,192 128,192 Q84,192 40,128 Z" fill="url(#iris)" filter="url(#glow)"/>
  <!-- Pupil -->
  <circle cx="128" cy="128" r="38" fill="#06060f"/>
  <circle cx="128" cy="128" r="38" fill="none" stroke="#6366f1" stroke-width="3" stroke-opacity="0.7"/>
  <!-- Shine -->
  <circle cx="114" cy="116" r="9" fill="white" opacity="0.14"/>
  <!-- Eyelid -->
  <path d="M40,128 Q84,64 128,64 Q172,64 216,128" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-opacity="0.5"/>
</svg>
