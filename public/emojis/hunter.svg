<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f0e1f"/>
      <stop offset="100%" stop-color="#07071a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <!-- Magnifying glass circle -->
  <circle cx="108" cy="108" r="60" fill="none" stroke="#6366f1" stroke-width="14" filter="url(#glow)"/>
  <circle cx="108" cy="108" r="60" fill="rgba(99,102,241,0.08)"/>
  <!-- Inner shine ring -->
  <circle cx="108" cy="108" r="42" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-opacity="0.25"/>
  <!-- Cross hairs -->
  <line x1="108" y1="72" x2="108" y2="144" stroke="#a5b4fc" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <line x1="72"  y1="108" x2="144" y2="108" stroke="#a5b4fc" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <!-- Handle -->
  <line x1="154" y1="154" x2="210" y2="210" stroke="#818cf8" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
</svg>
