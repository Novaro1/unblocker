<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f0e1f"/>
      <stop offset="100%" stop-color="#07071a"/>
    </radialGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <!-- Crown shape -->
  <path d="M40,180 L40,120 L80,152 L128,72 L176,152 L216,120 L216,180 Z"
        fill="url(#crownGrad)" filter="url(#glow)"/>
  <!-- Crown base band -->
  <rect x="40" y="172" width="176" height="22" rx="4" fill="#f59e0b" filter="url(#glow)"/>
  <!-- Jewels -->
  <circle cx="128" cy="82"  r="9" fill="#f9a8d4" filter="url(#glow)"/>
  <circle cx="57"  cy="130" r="7" fill="#93c5fd" filter="url(#glow)"/>
  <circle cx="199" cy="130" r="7" fill="#86efac" filter="url(#glow)"/>
</svg>
