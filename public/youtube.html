<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veil YouTube</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:             #060610;
      --surface:        #0e0e1e;
      --card:           #15152a;
      --border:         #1e1e38;
      --accent:         #6366f1;
      --accent2:        #818cf8;
      --accent-lighter: #a5b4fc;
      --text:           #ecedf8;
      --sub:            #6264a0;
      --muted:          #6264a0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── App shell ─────────────────────────────────────── */
    #yt-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ────────────────────────────────────────── */
    #yt-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: rgba(6,6,16,0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    #yt-back {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    #yt-back:hover { color: var(--text); }

    #yt-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      flex-shrink: 0;
    }
    #yt-logo svg { color: var(--accent-lighter); }

    #yt-search-form {
      flex: 1;
      display: flex;
      max-width: 520px;
      margin-left: auto;
    }
    #yt-search-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-right: none;
      border-radius: 8px 0 0 8px;
      padding: 0 14px;
      height: 36px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    #yt-search-input:focus { border-color: var(--accent); }
    #yt-search-input::placeholder { color: var(--muted); }
    #yt-search-btn {
      height: 36px;
      padding: 0 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: none;
      border-radius: 0 8px 8px 0;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: background 0.15s, color 0.15s;
    }
    #yt-search-btn:hover { background: var(--card); color: var(--text); }

    /* ── Body ──────────────────────────────────────────── */
    #yt-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Player panel ──────────────────────────────────── */
    #yt-player-panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      min-width: 0;
    }
    #yt-player-panel.visible { display: flex; }

    #yt-video-wrap {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16/9;
    }

    #yt-video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    #yt-player-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }
    #yt-player-overlay.hidden { display: none; }
    #yt-player-overlay .spin {
      width: 28px; height: 28px;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #yt-video-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
      letter-spacing: -0.2px;
    }
    #yt-video-meta {
      font-size: 13px;
      color: var(--muted);
    }

    /* ── Results panel ─────────────────────────────────── */
    #yt-results-panel {
      display: flex;
      flex-direction: column;
      width: 380px;
      min-width: 0;
      border-left: 1px solid var(--border);
      flex-shrink: 0;
      overflow: hidden;
    }
    #yt-results-panel.full { width: 100%; border: none; }

    #yt-results-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    #yt-results-scroll::-webkit-scrollbar { width: 6px; }
    #yt-results-scroll::-webkit-scrollbar-track { background: transparent; }
    #yt-results-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Empty / loading states ────────────────────────── */
    #yt-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 100%;
      color: var(--muted);
      text-align: center;
      padding: 40px 20px;
    }
    #yt-empty svg { opacity: 0.3; }
    #yt-empty p { font-size: 14px; }
    #yt-empty .yt-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }
    .yt-chip {
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .yt-chip:hover { border-color: var(--accent); color: var(--text); }

    #yt-status {
      display: none;
      padding: 16px 12px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    #yt-status.visible { display: block; }

    /* ── Result cards (list view) ─────────────────────── */
    .yt-result {
      display: flex;
      gap: 12px;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.12s;
      align-items: flex-start;
    }
    .yt-result:hover { background: var(--surface); }
    .yt-result.active { background: var(--surface); border: 1px solid var(--border); }

    .yt-result-thumb {
      position: relative;
      flex-shrink: 0;
      width: 120px;
      aspect-ratio: 16/9;
      border-radius: 6px;
      overflow: hidden;
      background: var(--card);
    }
    .yt-result-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .yt-result-duration {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .yt-result-info { flex: 1; min-width: 0; }
    .yt-result-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .yt-result-channel {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Grid view (no video selected) ────────────────── */
    #yt-grid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      padding: 4px;
    }
    #yt-grid.visible { display: grid; }

    .yt-grid-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.15s;
    }
    .yt-grid-card:hover { transform: translateY(-2px); }
    .yt-grid-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--card);
      overflow: hidden;
      border-radius: 10px;
    }
    .yt-grid-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s;
    }
    .yt-grid-card:hover .yt-grid-thumb img { transform: scale(1.03); }
    .yt-grid-duration {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .yt-grid-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      padding: 0 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .yt-grid-channel {
      font-size: 12px;
      color: var(--muted);
      padding: 0 4px 4px;
    }

    /* ── Player controls row ───────────────────────────── */
    #yt-player-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .yt-ctrl-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .yt-ctrl-btn:hover { border-color: var(--accent); color: var(--text); }

    /* ── Responsive ────────────────────────────────────── */
    @media (max-width: 700px) {
      #yt-results-panel { width: 100%; border-left: none; }
      #yt-body { flex-direction: column; }
      #yt-player-panel { padding: 12px; }
      #yt-search-form { max-width: none; }
      #yt-logo span { display: none; }
    }
  </style>
</head>
<body>

<div id="yt-app">

  <!-- Header -->
  <header id="yt-header">
    <a id="yt-back" href="/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M5 12l5-5M5 12l5 5"/>
      </svg>
      Launcher
    </a>

    <a id="yt-logo" href="/youtube">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="3"/>
        <polygon points="10,9 16,12 10,15" fill="currentColor" stroke="none"/>
      </svg>
      <span>YouTube</span>
    </a>

    <form id="yt-search-form" onsubmit="return false;">
      <input id="yt-search-input" type="text" placeholder="Search YouTube…" autocomplete="off" spellcheck="false">
      <button id="yt-search-btn" type="submit" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </form>
  </header>

  <!-- Body -->
  <div id="yt-body">

    <!-- Player panel (left, hidden until a video is selected) -->
    <div id="yt-player-panel">
      <div id="yt-video-wrap">
        <video id="yt-video" controls playsinline></video>
        <div id="yt-player-overlay">
          <div class="spin"></div>
          <span id="yt-overlay-msg">Loading…</span>
        </div>
      </div>
      <div id="yt-video-title"></div>
      <div id="yt-video-meta"></div>
      <div id="yt-player-controls">
        <button class="yt-ctrl-btn" onclick="closePlayer()">Close player</button>
      </div>
    </div>

    <!-- Results panel (right / full) -->
    <div id="yt-results-panel" class="full">
      <div id="yt-results-scroll">

        <!-- Sidebar list (shown when player is open) -->
        <div id="yt-list"></div>

        <!-- Empty state -->
        <div id="yt-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="3"/>
            <polygon points="10,9 16,12 10,15" fill="currentColor" stroke="none"/>
          </svg>
          <p>Search for videos to get started</p>
          <div class="yt-suggestions">
            <span class="yt-chip">Minecraft</span>
            <span class="yt-chip">Funny moments</span>
            <span class="yt-chip">Lofi study</span>
            <span class="yt-chip">How to code</span>
            <span class="yt-chip">Music</span>
          </div>
        </div>

        <!-- Loading / error status -->
        <div id="yt-status"></div>

        <!-- Grid results (no video selected) -->
        <div id="yt-grid"></div>


      </div>
    </div>

  </div>
</div>

<script>
  const searchForm   = document.getElementById("yt-search-form");
  const searchInput  = document.getElementById("yt-search-input");
  const resultsPanel = document.getElementById("yt-results-panel");
  const emptyState   = document.getElementById("yt-empty");
  const statusEl     = document.getElementById("yt-status");
  const gridEl       = document.getElementById("yt-grid");
  const listEl       = document.getElementById("yt-list");
  const playerPanel  = document.getElementById("yt-player-panel");
  const videoEl      = document.getElementById("yt-video");
  const overlay      = document.getElementById("yt-player-overlay");
  const overlayMsg   = document.getElementById("yt-overlay-msg");
  const ytTitle      = document.getElementById("yt-video-title");
  const ytMeta       = document.getElementById("yt-video-meta");

  let currentResults = [];
  let currentVideoId = null;
  let searching      = false;

  // ── Suggestions ────────────────────────────────────────
  document.querySelectorAll(".yt-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      searchInput.value = chip.textContent;
      doSearch(chip.textContent);
    });
  });

  // ── Search ─────────────────────────────────────────────
  searchForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = searchInput.value.trim();
    if (q) doSearch(q);
  });

  document.getElementById("yt-search-btn").addEventListener("click", () => {
    const q = searchInput.value.trim();
    if (q) doSearch(q);
  });

  async function doSearch(q) {
    if (searching) return;
    searching = true;

    emptyState.style.display = "none";
    gridEl.classList.remove("visible");
    gridEl.innerHTML = "";
    showStatus("Searching…");

    try {
      const res  = await fetch(`/api/youtube/search?q=${encodeURIComponent(q)}&limit=24`);
      const data = await res.json();

      if (!data.length) {
        showStatus("No results found.");
        searching = false;
        return;
      }

      currentResults = data;
      hideStatus();

      renderGrid(data);
    } catch (err) {
      showStatus("Search failed. Try again.");
      console.error(err);
    }
    searching = false;
  }

  function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.classList.add("visible");
  }
  function hideStatus() {
    statusEl.classList.remove("visible");
  }

  // ── Grid (full-width, no video active) ─────────────────
  function renderGrid(results) {
    gridEl.innerHTML = "";
    results.forEach(v => {
      const card = document.createElement("div");
      card.className = "yt-grid-card";
      card.innerHTML = `
        <div class="yt-grid-thumb">
          <img src="${v.thumb}" alt="" loading="lazy">
          ${v.durationF ? `<span class="yt-grid-duration">${v.durationF}</span>` : ""}
        </div>
        <div class="yt-grid-title">${esc(v.title)}</div>
        <div class="yt-grid-channel">${esc(v.channel)}</div>
      `;
      card.addEventListener("click", () => playVideo(v));
      gridEl.appendChild(card);
    });
    gridEl.classList.add("visible");
  }

  // ── List (sidebar, video active) ───────────────────────
  function renderList(results) {
    listEl.innerHTML = "";
    results.forEach(v => {
      const item = document.createElement("div");
      item.className = "yt-result" + (v.id === currentVideoId ? " active" : "");
      item.dataset.id = v.id;
      item.innerHTML = `
        <div class="yt-result-thumb">
          <img src="${v.thumb}" alt="" loading="lazy">
          ${v.durationF ? `<span class="yt-result-duration">${v.durationF}</span>` : ""}
        </div>
        <div class="yt-result-info">
          <div class="yt-result-title">${esc(v.title)}</div>
          <div class="yt-result-channel">${esc(v.channel)}</div>
        </div>
      `;
      item.addEventListener("click", () => playVideo(v));
      listEl.appendChild(item);
    });
  }

  // ── Player overlay helpers ─────────────────────────────────────────────────
  function showOverlay(msg, spin = true) {
    overlay.classList.remove("hidden");
    overlay.querySelector(".spin").style.display = spin ? "" : "none";
    overlayMsg.textContent = msg;
  }
  function hideOverlay() { overlay.classList.add("hidden"); }

  // ── Play video — Cobalt API ────────────────────────────────────────────────
  // api.cobalt.tools is called directly from the browser (CORS-enabled).
  // Cobalt fetches from YouTube on its own servers and tunnels a stream URL
  // back — no sign-in, no bot checks, no iframe restrictions.
  async function playVideo(v) {
    currentVideoId = v.id;
    ytTitle.textContent = v.title;
    ytMeta.textContent  = v.channel + (v.durationF ? ` · ${v.durationF}` : "");
    videoEl.src    = "";
    videoEl.poster = v.thumb;
    showOverlay("Fetching video…");

    playerPanel.classList.add("visible");
    resultsPanel.classList.remove("full");
    if (currentResults.length) renderList(currentResults);

    try {
      const res = await fetch("https://api.cobalt.tools/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json",
        },
        body: JSON.stringify({
          url: `https://www.youtube.com/watch?v=${v.id}`,
          videoQuality: "720",
          filenameStyle: "basic",
        }),
        signal: AbortSignal.timeout(20000),
      });

      const data = await res.json();

      if (data.status === "tunnel" || data.status === "redirect") {
        videoEl.src = data.url;
        hideOverlay();
        videoEl.play().catch(() => {});
      } else if (data.status === "picker") {
        // picker = multiple streams; pick first video item
        const item = data.picker?.find(p => p.type === "video") ?? data.picker?.[0];
        if (item?.url) {
          videoEl.src = item.url;
          hideOverlay();
          videoEl.play().catch(() => {});
        } else {
          showOverlay("No playable stream found.", false);
        }
      } else {
        const msg = data.error?.code ?? data.error?.message ?? "Unknown error from Cobalt.";
        showOverlay(msg, false);
      }
    } catch (err) {
      showOverlay("Could not reach video service. " + (err.message ?? ""), false);
    }
  }

  function closePlayer() {
    videoEl.src    = "";
    videoEl.poster = "";
    hideOverlay();
    playerPanel.classList.remove("visible");
    resultsPanel.classList.add("full");
    currentVideoId = null;
    listEl.innerHTML = "";
    if (currentResults.length) renderGrid(currentResults);
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
</script>

</body>
</html>
