<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#07071a"/>
      <stop offset="50%"  stop-color="#0c0b22"/>
      <stop offset="100%" stop-color="#060614"/>
    </linearGradient>
    <radialGradient id="leftGlow" cx="20%" cy="50%" r="45%">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="80%" cy="55%" r="40%">
      <stop offset="0%"   stop-color="#ec4899" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%"   stop-color="#a5b4fc"/>
      <stop offset="55%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </radialGradient>
    <radialGradient id="pupilGrad" cx="40%" cy="38%" r="55%">
      <stop offset="0%"   stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#06060f"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#leftGlow)"/>
  <rect width="1200" height="400" fill="url(#rightGlow)"/>

  <!-- Scanlines texture -->
  <rect width="1200" height="400" fill="none"
        style="background: repeating-linear-gradient(0deg, rgba(0,0,0,0.04) 0px, rgba(0,0,0,0.04) 1px, transparent 1px, transparent 3px)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#6366f1" stroke-width="0.4" stroke-opacity="0.06">
    <line x1="0"    y1="100" x2="1200" y2="100"/>
    <line x1="0"    y1="200" x2="1200" y2="200"/>
    <line x1="0"    y1="300" x2="1200" y2="300"/>
    <line x1="200"  y1="0"   x2="200"  y2="400"/>
    <line x1="400"  y1="0"   x2="400"  y2="400"/>
    <line x1="600"  y1="0"   x2="600"  y2="400"/>
    <line x1="800"  y1="0"   x2="800"  y2="400"/>
    <line x1="1000" y1="0"   x2="1000" y2="400"/>
  </g>

  <!-- Decorative orbit rings — left side -->
  <circle cx="200" cy="200" r="155" fill="none" stroke="#6366f1" stroke-width="0.6" stroke-opacity="0.15"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="#6366f1" stroke-width="0.4" stroke-opacity="0.1"/>

  <!-- Stars -->
  <g fill="#a5b4fc">
    <circle cx="60"   cy="55"  r="1.2" opacity="0.6"/>
    <circle cx="320"  cy="38"  r="0.9" opacity="0.4"/>
    <circle cx="480"  cy="72"  r="1.4" opacity="0.5"/>
    <circle cx="720"  cy="42"  r="1"   opacity="0.45"/>
    <circle cx="950"  cy="60"  r="1.3" opacity="0.55"/>
    <circle cx="1100" cy="35"  r="0.8" opacity="0.4"/>
    <circle cx="1160" cy="120" r="1.1" opacity="0.5"/>
    <circle cx="1140" cy="320" r="1.2" opacity="0.45"/>
    <circle cx="980"  cy="355" r="0.9" opacity="0.4"/>
    <circle cx="820"  cy="372" r="1.3" opacity="0.5"/>
    <circle cx="550"  cy="360" r="1"   opacity="0.4"/>
    <circle cx="380"  cy="350" r="1.4" opacity="0.55"/>
    <circle cx="80"   cy="340" r="1"   opacity="0.4"/>
    <circle cx="42"   cy="200" r="1.5" opacity="0.35"/>
  </g>

  <!-- Eye — left zone -->
  <!-- Eye glow -->
  <ellipse cx="200" cy="200" rx="90" ry="52" fill="#6366f1" filter="url(#bigGlow)" opacity="0.2"/>
  <!-- Eye shape -->
  <path d="M110,200 Q155,138 200,138 Q245,138 290,200 Q245,262 200,262 Q155,262 110,200 Z"
        fill="url(#eyeGrad)" filter="url(#glow)"/>
  <!-- Iris -->
  <circle cx="200" cy="200" r="42" fill="url(#pupilGrad)"/>
  <circle cx="200" cy="200" r="42" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="200" cy="200" r="35" fill="none" stroke="#818cf8" stroke-width="0.7" stroke-opacity="0.3"/>
  <!-- Pupil -->
  <circle cx="200" cy="200" r="21" fill="#030308"/>
  <!-- Reflection -->
  <circle cx="191" cy="191" r="5.5" fill="white" opacity="0.13"/>

  <!-- Eyelid line -->
  <path d="M110,200 Q155,138 200,138 Q245,138 290,200"
        fill="none" stroke="#c7d2fe" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Veil mark under eye -->
  <g opacity="0.7" filter="url(#glow)">
    <line x1="155" y1="272" x2="245" y2="272" stroke="rgba(165,180,252,0.2)" stroke-width="1" stroke-linecap="round"/>
    <path d="M168,290 L200,242 L232,290" stroke="#a5b4fc" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Divider line -->
  <line x1="340" y1="100" x2="340" y2="300" stroke="#6366f1" stroke-width="0.6" stroke-opacity="0.2"/>

  <!-- Right side: text content -->
  <!-- VEIL small label -->
  <text x="390" y="138"
        font-family="'Arial', sans-serif"
        font-weight="700"
        font-size="11"
        letter-spacing="7"
        fill="#6366f1"
        opacity="0.7">VEIL</text>

  <!-- THE PHANTOM CHALLENGE — main title -->
  <text x="388" y="205"
        font-family="'Arial Black', 'Arial Bold', 'Arial', sans-serif"
        font-weight="900"
        font-size="58"
        letter-spacing="-1"
        fill="#e0e7ff"
        filter="url(#titleGlow)"
        opacity="0.97">THE PHANTOM</text>
  <text x="390" y="264"
        font-family="'Arial Black', 'Arial Bold', 'Arial', sans-serif"
        font-weight="900"
        font-size="58"
        letter-spacing="-1"
        fill="#6366f1"
        filter="url(#titleGlow)"
        opacity="0.95">CHALLENGE</text>

  <!-- Tagline -->
  <text x="391" y="305"
        font-family="Arial, sans-serif"
        font-size="15"
        letter-spacing="0.5"
        fill="rgba(255,255,255,0.38)">Something is hidden. Find it. </text>
  <text x="693" y="305"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="700"
        letter-spacing="0.5"
        fill="#a5b4fc"
        opacity="0.85">First to claim wins.</text>

  <!-- Active badge -->
  <rect x="390" y="325" width="84" height="26" rx="13" fill="rgba(99,102,241,0.15)" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="404" cy="338" r="4" fill="#6ee7b7"/>
  <text x="413" y="343"
        font-family="Arial, sans-serif"
        font-weight="700"
        font-size="10"
        letter-spacing="2.5"
        fill="#a5b4fc">ACTIVE</text>

  <!-- Prize badge -->
  <rect x="488" y="325" width="178" height="26" rx="13" fill="rgba(236,72,153,0.1)" stroke="#ec4899" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="507" y="342"
        font-family="Arial, sans-serif"
        font-size="10.5"
        letter-spacing="0.3"
        fill="rgba(255,255,255,0.5)">Prize: </text>
  <text x="535" y="342"
        font-family="Arial, sans-serif"
        font-weight="700"
        font-size="10.5"
        letter-spacing="0.3"
        fill="#f9a8d4">Phantom Hunter + Nitro</text>

  <!-- Bottom border glow -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#leftGlow)" opacity="0.6"/>
  <line x1="0" y1="399" x2="1200" y2="399" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.3"/>
</svg>
