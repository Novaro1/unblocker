<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 320px; background: #0f1117; color: #e2e8f0; }

  .header { background: #1e2130; padding: 14px 16px; border-bottom: 1px solid #2d3148; display: flex; align-items: center; gap: 10px; }
  .header h1 { font-size: 14px; font-weight: 600; color: #fff; }
  .header .sub { font-size: 11px; color: #64748b; margin-top: 2px; }

  .section { padding: 12px 16px; }
  .section + .section { border-top: 1px solid #1e2130; }

  .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 8px; }

  .field-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .field-row label { font-size: 12px; color: #94a3b8; width: 72px; flex-shrink: 0; }
  .field-row input {
    flex: 1; background: #1e2130; border: 1px solid #2d3148; border-radius: 6px;
    color: #e2e8f0; font-size: 12px; padding: 5px 8px; font-family: monospace;
    outline: none;
  }
  .field-row input:focus { border-color: #6366f1; }
  .field-row .copy-btn {
    background: #2d3148; border: none; border-radius: 5px; color: #94a3b8;
    cursor: pointer; font-size: 11px; padding: 5px 8px; flex-shrink: 0;
    transition: background 0.15s;
  }
  .field-row .copy-btn:hover { background: #3d4168; color: #fff; }

  .btn {
    display: block; width: 100%; padding: 9px 12px; border-radius: 7px; border: none;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: filter 0.15s;
    margin-bottom: 8px;
  }
  .btn:last-child { margin-bottom: 0; }
  .btn:hover { filter: brightness(1.1); }
  .btn-primary { background: #6366f1; color: #fff; }
  .btn-green   { background: #22c55e; color: #fff; }
  .btn-yellow  { background: #f59e0b; color: #fff; }
  .btn-ghost   { background: #1e2130; color: #94a3b8; border: 1px solid #2d3148; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }

  /* Verification section */
  .verify-status {
    font-size: 12px; padding: 8px 10px; border-radius: 6px;
    margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
  }
  .verify-status.waiting  { background: #1e2130; color: #94a3b8; border: 1px solid #2d3148; }
  .verify-status.found    { background: #14532d; color: #86efac; border: 1px solid #22c55e40; }
  .verify-status.error    { background: #450a0a; color: #fca5a5; border: 1px solid #ef444440; }
  .verify-status .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .waiting .dot  { background: #475569; animation: pulse 1.5s infinite; }
  .found .dot    { background: #22c55e; }
  .error .dot    { background: #ef4444; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.3 } }

  #accounts-list { max-height: 180px; overflow-y: auto; }
  .account-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 0;
    border-bottom: 1px solid #1a1d2e; font-size: 12px;
  }
  .account-item:last-child { border-bottom: none; }
  .account-item .username { font-family: monospace; color: #a5b4fc; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account-item .del-btn {
    background: none; border: none; color: #ef4444; cursor: pointer;
    font-size: 14px; line-height: 1; padding: 2px 4px; opacity: 0.6; flex-shrink: 0;
  }
  .account-item .del-btn:hover { opacity: 1; }

  .empty { color: #475569; font-size: 12px; text-align: center; padding: 20px 0; }

  .toast {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: #22c55e; color: #fff; font-size: 12px; font-weight: 600;
    padding: 6px 14px; border-radius: 20px; pointer-events: none;
    opacity: 0; transition: opacity 0.2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>FreeDNS Account Helper</h1>
    <div class="sub">for Veil · <span id="acct-count">0</span> account(s) saved</div>
  </div>
</div>

<!-- Generate credentials -->
<div class="section">
  <div class="label">Generated Credentials</div>
  <div class="field-row">
    <label>First name</label>
    <input id="gen-firstname" type="text" readonly>
    <button class="copy-btn" data-target="gen-firstname">Copy</button>
  </div>
  <div class="field-row">
    <label>Last name</label>
    <input id="gen-lastname" type="text" readonly>
    <button class="copy-btn" data-target="gen-lastname">Copy</button>
  </div>
  <div class="field-row">
    <label>Username</label>
    <input id="gen-user" type="text" readonly>
    <button class="copy-btn" data-target="gen-user">Copy</button>
  </div>
  <div class="field-row">
    <label>Password</label>
    <input id="gen-pass" type="text" readonly>
    <button class="copy-btn" data-target="gen-pass">Copy</button>
  </div>
  <div class="field-row">
    <label>Email</label>
    <input id="gen-email" type="text" readonly placeholder="Fetching inbox…">
    <button class="copy-btn" data-target="gen-email">Copy</button>
  </div>

  <button class="btn btn-primary" id="btn-regen">↻ Regenerate</button>
  <button class="btn btn-green"   id="btn-fill" disabled>Fill FreeDNS Form &amp; Open</button>
  <button class="btn btn-ghost"   id="btn-save">Save These Credentials</button>
</div>

<!-- Email verification -->
<div class="section">
  <div class="label">Email Verification</div>
  <div class="verify-status waiting" id="verify-status">
    <span class="dot"></span>
    <span id="verify-text">Submit the signup form to start watching for the activation email.</span>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-ghost" id="btn-check" style="margin-bottom:0">Check Inbox</button>
    <button class="btn btn-yellow" id="btn-activate" style="margin-bottom:0;display:none">Open Activation Link</button>
  </div>
</div>

<!-- Saved accounts -->
<div class="section">
  <div class="label">Saved Accounts</div>
  <div id="accounts-list"><div class="empty">No accounts saved yet.</div></div>
  <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
    <button class="btn btn-green"  id="btn-push-all" style="margin-bottom:0">Push All to Server</button>
    <button class="btn btn-ghost"  id="btn-export"   style="margin-bottom:0">Export JSON</button>
    <button class="btn btn-ghost"  id="btn-clear"    style="margin-bottom:0;flex-shrink:0;width:auto;padding:9px 14px">Clear All</button>
  </div>
  <div id="push-status" style="font-size:11px;color:#64748b;margin-top:6px;display:none"></div>
</div>

<!-- Server settings -->
<div class="section">
  <div class="label">Server Settings</div>
  <div class="field-row">
    <label>Server URL</label>
    <input id="cfg-server" type="text" placeholder="https://veilub.mooo.com" style="font-family:monospace;font-size:11px">
  </div>
  <div class="field-row">
    <label>API Key</label>
    <input id="cfg-key" type="password" placeholder="FREEDNS_API_KEY value">
  </div>
  <button class="btn btn-ghost" id="btn-save-cfg" style="margin-bottom:0">Save Settings</button>
</div>

<div class="toast" id="toast"></div>

<script src="popup.js"></script>
</body>
</html>
